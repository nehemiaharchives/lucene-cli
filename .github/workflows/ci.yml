name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: ${{ matrix.platform }} tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: JVM
            os: ubuntu-latest
            task: jvmTest
          - platform: Linux x64
            os: ubuntu-latest
            task: linuxX64Test
          - platform: macOS ARM64
            os: macos-latest
            task: macosArm64Test
          - platform: Windows x64
            os: windows-latest
            task: mingwX64Test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run ${{ matrix.task }}
        shell: bash
        run: ./gradlew ${{ matrix.task }} --stacktrace
